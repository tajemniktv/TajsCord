name: Publish to WinGet
on:
    release:
        types: [released]
jobs:
    publish:
        runs-on: windows-latest
        steps:
            - uses: vedantmgoyal9/winget-releaser@main
              with:
                identifier: tajemniktv.TajsCord
                installers-regex: '-win-\w+\.exe$'
                token: ${{secrets.PUBLIC_REPO_READ}}
